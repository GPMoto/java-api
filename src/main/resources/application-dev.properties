# ========== PERFIL DE DESENVOLVIMENTO ==========
# Este arquivo contém configurações específicas para desenvolvimento
# Para usar: mvn spring-boot:run -Dspring-boot.run.profiles=dev

# ========== CACHE COMPLETAMENTE DESABILITADO ==========
# Templates Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Recursos estáticos (CSS, JS, imagens)
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Cache de mensagens de internacionalização
spring.messages.cache-duration=0

# ========== HOT RELOAD E LIVE RELOAD ==========
# DevTools habilitado
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400

# Sessões não persistentes
server.servlet.session.persistent=false

# ========== LOGS PARA DEBUG ==========
logging.level.org.springframework.web=INFO
logging.level.org.thymeleaf=INFO
logging.level.web=DEBUG

# Logs SQL mais detalhados
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========== HEADERS HTTP PARA DESENVOLVIMENTO ==========
# Adicionar headers para evitar cache no navegador
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false