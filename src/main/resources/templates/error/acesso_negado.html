<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos :: cabecalho(#{error.access.title})}" />

    <body>
        <main>
            <nav th:if="${usuario != null}">
                <ul>
                    <li><strong th:text="#{error.access.title}">Acesso Negado</strong></li>
                </ul>
                <ul>
                    <li>
                        <div th:replace="~{fragmentos :: language-selector}" />
                    </li>
                    <li><a th:href="@{/login/index}" th:text="#{nav.home}">Início</a></li>
                    <li>
                        <a
                            th:href="@{/view/qrcode/{idFilial}(idFilial = ${idFilial})}"
                            th:text="#{nav.identificadores}"
                            >QR Codes</a
                        >
                    </li>
                </ul>
            </nav>

            <article>
                <header>
                    <h1 th:text="${titulo}">Acesso Negado</h1>
                </header>

                <p th:text="${mensagem}">
                    Você não tem permissão para acessar esta página ou realizar
                    esta operação.
                </p>

                <p th:text="${submensagem}">
                    Entre em contato com o administrador do sistema se acredita
                    que deveria ter acesso.
                </p>

                <footer>
                    <button onclick="history.back()" th:text="#{error.access.back}">Voltar</button>
                    <a th:href="@{/login/index}" role="button" th:text="#{error.access.home}">Ir para Início</a>
                    <div th:if="${usuario == null}">
                        <a th:href="@{/login}" role="button" th:text="#{error.access.login}">Fazer Login</a>
                    </div>
                </footer>

                <aside th:if="${usuario != null}">
                    <p>
                        <small>
                            <strong th:text="#{error.access.user.logged} + ':'">Usuário logado:</strong>
                            <span th:text="${usuario.nmUsuario}"></span><br />
                            <strong th:text="#{error.access.user.profile} + ':'">Perfil:</strong>
                            <span
                                th:text="${usuario.idPerfil?.nmPerfil}"
                            ></span>
                        </small>
                    </p>
                </aside>
            </article>
        </main>
    </body>
</html>
