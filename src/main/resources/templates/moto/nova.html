<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos :: cabecalho('Inserir moto')}" />
    <body>
        <main>
            <header
                style="
                    display: grid;
                    grid-template-columns: 1fr auto;
                    align-items: center;
                "
            >
                <h2>Cadastrar Nova Moto</h2>
                <a th:href="@{/login/index}" role="button">Voltar</a>
            </header>

            <div th:if="${errorMessage}">
                <span th:text="${errorMessage}"></span>
            </div>

            <div th:if="${errors != null and !errors.empty}">
                <strong>Erros de validação:</strong>
                <ul>
                    <li
                        th:each="error : ${errors}"
                        th:text="${error.defaultMessage}"
                    ></li>
                </ul>
            </div>

            <form th:action="@{/view/moto}" th:object="${moto}" method="post">
                <label for="identificador">
                    Identificador
                    <input
                        type="text"
                        id="identificador"
                        th:field="*{identificador}"
                        maxlength="50"
                        required
                    />
                </label>

                <label for="status">
                    Status
                    <input
                        type="text"
                        id="status"
                        th:field="*{status}"
                        maxlength="50"
                        required
                    />
                </label>

                <label for="condicoesManutencao">
                    Condições de Manutenção
                    <input
                        type="text"
                        id="condicoesManutencao"
                        th:field="*{condicoesManutencao}"
                        maxlength="200"
                        required
                    />
                </label>

                <label for="idTipoMoto">
                    Tipo da Moto
                    <select id="idTipoMoto" th:field="*{idTipoMoto}" required>
                        <option
                            th:each="tipo : ${tiposMoto}"
                            th:value="${tipo.id_tipo_moto}"
                            th:text="${tipo.nmTipo}"
                        ></option>
                    </select>
                </label>

                <label for="idSecaoFilial">
                    Seção/Filial
                    <select
                        id="idSecaoFilial"
                        th:field="*{idSecaoFilial}"
                        required
                    >
                        <option
                            th:each="secao : ${secoesFilial}"
                            th:value="${secao.idTipoSecao.idTipoSecao}"
                            th:text="${secao.idTipoSecao.nmSecao}"
                        ></option>
                    </select>
                </label>

                <button type="submit">Cadastrar</button>
            </form>
        </main>
    </body>
</html>
