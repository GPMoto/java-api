<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos :: cabecalho('Atualizar Filial')}" />
    <body>
        <main>
            <header
                style="
                    display: grid;
                    grid-template-columns: 1fr auto;
                    align-items: center;
                "
            >
                <h2>Atualizar Filial</h2>
                <a th:href="@{/login/index}" role="button">Voltar</a>
            </header>

            <div th:if="${errorMessage}">
                <span th:text="${errorMessage}"></span>
            </div>

            <div th:if="${param.erro != null and param.erro[0] == 'true'}">
                <strong>Erro!</strong> Ocorreu um problema ao atualizar a
                filial. Tente novamente.
            </div>

            <div th:if="${errors != null and !errors.empty}">
                <strong>Erros de validação:</strong>
                <ul>
                    <li
                        th:each="error : ${errors}"
                        th:text="${error.defaultMessage}"
                    ></li>
                </ul>
            </div>

            <div th:if="${param.sucesso}">Filial atualizada com sucesso!</div>

            <form
                th:action="@{/view/filial/editar/{idFilial}(idFilial = ${filial.idFilial})}"
                method="post"
            >
                <input
                    type="hidden"
                    name="idFilial"
                    th:value="${filial.idFilial}"
                />
                <input
                    type="hidden"
                    name="idEndereco"
                    th:value="${filial.idEndereco != null ? filial.idEndereco.idEndereco : ''}"
                />
                <input
                    type="hidden"
                    name="idContato"
                    th:value="${filial.idContato != null ? filial.idContato.idContato : ''}"
                />

                <label for="cnpjFilial">
                    CNPJ
                    <input
                        type="text"
                        name="cnpjFilial"
                        th:value="${filial.cnpjFilial}"
                        id="cnpjFilial"
                        maxlength="14"
                        required
                    />
                </label>

                <label for="senhaFilial">
                    Senha da Filial
                    <input
                        type="password"
                        name="senhaFilial"
                        th:value="${filial.senhaFilial}"
                        id="senhaFilial"
                        maxlength="200"
                        required
                    />
                </label>

                <h4>Endereço</h4>

                <label for="cep">
                    CEP
                    <input
                        type="text"
                        name="cep"
                        th:value="${filial.idEndereco != null ? filial.idEndereco.cep : ''}"
                        id="cep"
                        maxlength="8"
                        required
                    />
                </label>

                <label for="nmLogradouro">
                    Logradouro
                    <input
                        type="text"
                        name="nmLogradouro"
                        th:value="${filial.idEndereco != null ? filial.idEndereco.nmLogradouro : ''}"
                        id="nmLogradouro"
                        maxlength="200"
                        required
                    />
                </label>

                <label for="nrLogradouro">
                    Número
                    <input
                        type="number"
                        name="nrLogradouro"
                        th:value="${filial.idEndereco != null ? filial.idEndereco.nrLogradouro : ''}"
                        id="nrLogradouro"
                        max="99999"
                        required
                    />
                </label>

                <label for="idCidade">
                    Cidade
                    <select name="idCidade" id="idCidade" required>
                        <option
                            th:each="cidade : ${cidades}"
                            th:value="${cidade.idCidade}"
                            th:text="${cidade.nmCidade}"
                            th:selected="${filial.idEndereco != null and filial.idEndereco.idCidade != null and filial.idEndereco.idCidade.idCidade == cidade.idCidade}"
                        ></option>
                    </select>
                </label>

                <h4>Contato</h4>

                <label for="nmDono">
                    Nome do Responsável
                    <input
                        type="text"
                        name="nmDono"
                        th:value="${filial.idContato != null ? filial.idContato.nmDono : ''}"
                        id="nmDono"
                        maxlength="200"
                        required
                    />
                </label>

                <label for="status">
                    Status do Contato
                    <select name="status" id="status" required>
                        <option
                            value="0"
                            th:selected="${filial.idContato != null and filial.idContato.status == 0}"
                        >
                            Inativo
                        </option>
                        <option
                            value="1"
                            th:selected="${filial.idContato != null and filial.idContato.status == 1}"
                        >
                            Ativo
                        </option>
                    </select>
                </label>

                <label for="ddd">
                    DDD
                    <input
                        type="text"
                        name="ddd"
                        th:value="${filial.idContato != null and filial.idContato.idTelefone != null ? filial.idContato.idTelefone.ddd : ''}"
                        id="ddd"
                        maxlength="2"
                        required
                    />
                </label>

                <label for="numero">
                    Telefone
                    <input
                        type="text"
                        name="numero"
                        th:value="${filial.idContato != null and filial.idContato.idTelefone != null ? filial.idContato.idTelefone.numero : ''}"
                        id="numero"
                        maxlength="15"
                        required
                    />
                </label>

                <button type="submit">Atualizar Filial</button>
            </form>
        </main>
    </body>
</html>
