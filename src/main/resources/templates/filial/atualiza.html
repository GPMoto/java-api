<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos :: cabecalho(#{filial.update.title})}" />
    <body>
        <style th:replace="~{fragmentos :: footer-styles}"></style>
        <main>
            <div th:replace="~{fragmentos :: logo}" />
            <header
                style="
                    display: grid;
                    grid-template-columns: 1fr auto;
                    align-items: center;
                "
            >
                <h2 th:text="#{filial.update.header}">Atualizar Filial</h2>
                <a th:href="@{/login/index}" role="button" th:text="#{usuario.back}">Voltar</a>
            </header>

            <div th:if="${errorMessage}">
                <span th:text="${errorMessage}"></span>
            </div>

            <div th:if="${param.erro != null and param.erro[0] == 'true'}">
                <strong th:text="#{filial.update.error}">Erro! Ocorreu um problema ao atualizar a filial. Tente novamente.</strong>
            </div>

            <div th:if="${errors != null and !errors.empty}">
                <strong th:text="#{usuario.validation.errors}">Erros de validação:</strong>
                <ul>
                    <li
                        th:each="error : ${errors}"
                        th:text="${error.defaultMessage}"
                    ></li>
                </ul>
            </div>

            <div th:if="${param.sucesso}" th:text="#{filial.update.success}">Filial atualizada com sucesso!</div>

            <form
                th:action="@{/view/filial/editar/{idFilial}(idFilial = ${filial.idFilial})}"
                method="post"
            >
                <input
                    type="hidden"
                    name="idFilial"
                    th:value="${filial.idFilial}"
                />
                <input
                    type="hidden"
                    name="idEndereco"
                    th:value="${filial.idEndereco != null ? filial.idEndereco.idEndereco : ''}"
                />
                <input
                    type="hidden"
                    name="idContato"
                    th:value="${filial.idContato != null ? filial.idContato.idContato : ''}"
                />

                <label for="cnpjFilial">
                    <span th:text="#{filial.field.cnpj}">CNPJ</span>
                    <input
                        type="text"
                        name="cnpjFilial"
                        th:value="${filial.cnpjFilial}"
                        id="cnpjFilial"
                        maxlength="14"
                        required
                    />
                </label>

                <label for="senhaFilial">
                    <span th:text="#{filial.field.senha}">Senha da Filial</span>
                    <input
                        type="password"
                        name="senhaFilial"
                        th:value="${filial.senhaFilial}"
                        id="senhaFilial"
                        maxlength="200"
                        required
                    />
                </label>

                <h4 th:text="#{filial.section.endereco}">Endereço</h4>

                <label for="cep">
                    <span th:text="#{filial.field.cep}">CEP</span>
                    <input
                        type="text"
                        name="cep"
                        th:value="${filial.idEndereco != null ? filial.idEndereco.cep : ''}"
                        id="cep"
                        maxlength="8"
                        required
                    />
                </label>

                <label for="nmLogradouro">
                    <span th:text="#{filial.field.logradouro}">Logradouro</span>
                    <input
                        type="text"
                        name="nmLogradouro"
                        th:value="${filial.idEndereco != null ? filial.idEndereco.nmLogradouro : ''}"
                        id="nmLogradouro"
                        maxlength="200"
                        required
                    />
                </label>

                <label for="nrLogradouro">
                    <span th:text="#{filial.field.numero}">Número</span>
                    <input
                        type="number"
                        name="nrLogradouro"
                        th:value="${filial.idEndereco != null ? filial.idEndereco.nrLogradouro : ''}"
                        id="nrLogradouro"
                        max="99999"
                        required
                    />
                </label>

                <label for="idCidade">
                    <span th:text="#{filial.field.cidade}">Cidade</span>
                    <select name="idCidade" id="idCidade" required>
                        <option
                            th:each="cidade : ${cidades}"
                            th:value="${cidade.idCidade}"
                            th:text="${cidade.nmCidade}"
                            th:selected="${filial.idEndereco != null and filial.idEndereco.idCidade != null and filial.idEndereco.idCidade.idCidade == cidade.idCidade}"
                        ></option>
                    </select>
                </label>

                <h4 th:text="#{filial.section.contato}">Contato</h4>

                <label for="nmDono">
                    <span th:text="#{filial.field.responsavel}">Nome do Responsável</span>
                    <input
                        type="text"
                        name="nmDono"
                        th:value="${filial.idContato != null ? filial.idContato.nmDono : ''}"
                        id="nmDono"
                        maxlength="200"
                        required
                    />
                </label>

                <label for="status">
                    <span th:text="#{filial.field.status.contato}">Status do Contato</span>
                    <select name="status" id="status" required>
                        <option
                            value="0"
                            th:selected="${filial.idContato != null and filial.idContato.status == 0}"
                            th:text="#{filial.field.status.inativo}"
                        >
                            Inativo
                        </option>
                        <option
                            value="1"
                            th:selected="${filial.idContato != null and filial.idContato.status == 1}"
                            th:text="#{filial.field.status.ativo}"
                        >
                            Ativo
                        </option>
                    </select>
                </label>

                <label for="ddd">
                    <span th:text="#{filial.field.ddd}">DDD</span>
                    <input
                        type="text"
                        name="ddd"
                        th:value="${filial.idContato != null and filial.idContato.idTelefone != null ? filial.idContato.idTelefone.ddd : ''}"
                        id="ddd"
                        maxlength="2"
                        required
                    />
                </label>

                <label for="numero">
                    <span th:text="#{filial.field.telefone.numero}">Telefone</span>
                    <input
                        type="text"
                        name="numero"
                        th:value="${filial.idContato != null and filial.idContato.idTelefone != null ? filial.idContato.idTelefone.numero : ''}"
                        id="numero"
                        maxlength="15"
                        required
                    />
                </label>

                <button type="submit" th:text="#{filial.submit.update}">Atualizar Filial</button>
            </form>
            <div th:replace="~{fragmentos :: rodape}"></div>

        </main>
    </body>
</html>
