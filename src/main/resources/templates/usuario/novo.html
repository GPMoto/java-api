<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos :: cabecalho(#{usuario.new.title})}" />
    <body>
        <style th:replace="~{fragmentos :: footer-styles}"></style>
        <main>
            <div th:replace="~{fragmentos :: logo}" />
            <header
                style="
                    display: grid;
                    grid-template-columns: 1fr auto;
                    align-items: center;
                "
            >
                <h2 th:text="#{usuario.new.header}">Criar Novo Usuário</h2>
                <a th:href="@{/login/index}" role="button" th:text="#{usuario.back}">Voltar</a>
            </header>

            <div th:if="${errors}">
                <strong th:text="#{usuario.validation.errors}">Erros de validação:</strong>
                <ul>
                    <li
                        th:each="err : ${errors}"
                        th:text="${err.defaultMessage}"
                    ></li>
                </ul>
            </div>

            <form
                th:action="@{/view/usuario/novo/{idFilial}(idFilial=${idFilial})}"
                th:object="${usuario}"
                method="post"
            >
                <label for="nmUsuario">
                    <span th:text="#{usuario.field.nome}">Nome</span>
                    <input
                        type="text"
                        id="nmUsuario"
                        th:field="*{nome}"
                        maxlength="200"
                        required
                    />
                </label>

                <label for="nmEmail">
                    <span th:text="#{usuario.field.email}">Email</span>
                    <input
                        type="email"
                        id="nmEmail"
                        th:field="*{email}"
                        maxlength="200"
                        required
                    />
                </label>

                <label for="senha">
                    <span th:text="#{usuario.field.senha}">Senha</span>
                    <input
                        type="password"
                        id="senha"
                        th:field="*{senha}"
                        maxlength="200"
                        required
                    />
                </label>

                <label for="idPerfil">
                    <span th:text="#{usuario.field.perfil}">Perfil</span>
                    <select id="idPerfil" th:field="*{idPerfil}" required>
                        <option
                            th:each="perfil : ${perfis}"
                            th:value="${perfil.idPerfil}"
                            th:text="${perfil.nmPerfil}"
                        ></option>
                    </select>
                </label>

                <input
                    type="hidden"
                    th:field="*{idFilial}"
                    th:value="${idFilial}"
                />

                <button type="submit" th:text="#{usuario.submit}">Criar Usuário</button>
            </form>
            <div th:replace="~{fragmentos :: rodape}"></div>

        </main>
    </body>
</html>
