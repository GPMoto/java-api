<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecalho(#{home.title})}" />

<body>
    <style th:replace="~{fragmentos :: footer-styles}"></style>
    
    <main>
        <div th:replace="~{fragmentos :: logo}" />

        <nav>
            <ul>
                <li>
                    <div th:replace="~{fragmentos :: language-selector}" />
                </li>
            </ul>
            <ul>
                <li>
                    <a th:href="@{/view/filial/{idFilial}(idFilial = ${idFilial})}" th:text="#{nav.filial}">Filial</a>
                </li>
                <li>
                    <a href="/view/secao-filial" th:text="#{nav.secoes}">Seções da Filial</a>
                </li>
                <li>
                    <form th:replace="~{fragmentos :: form-logout}" />
                </li>
            </ul>
        </nav>

        <h1 th:text="#{home.header}">Lista de motos</h1>

        <!-- Cards de Estatísticas -->
        <div class="stats-container">
            <div class="stat-card">
                <h3>📊 Total de Motos</h3>
                <p class="stat-number" th:text="${#lists.size(motos)}">0</p>
            </div>
            <div class="stat-card">
                <h3>🔍 Rápido Acesso</h3>
                <p class="stat-desc">Use a busca abaixo</p>
            </div>
            <div class="stat-card">
                <h3>⚡ Status</h3>
                <p class="stat-desc">Gerencie suas motos</p>
            </div>
        </div>

        <!-- Campo de Busca -->
        <div class="search-container">
            <label for="searchInput">
                🔍 <span th:text="#{home.search}">Buscar moto</span>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Digite o identificador, status ou tipo..."
                    onkeyup="filterTable()"
                />
            </label>
        </div>

        <table id="motosTable">
            <thead>
                <tr>
                    <th scope="col" th:text="#{table.id}">ID</th>
                    <th scope="col" th:text="#{table.identificador}">Identificador</th>
                    <th scope="col" th:text="#{table.status}">Status</th>
                    <th scope="col" th:text="#{table.condicoesManutencao}">Condições de Manutenção</th>
                    <th scope="col" th:text="#{table.tipoMoto}">Tipo Moto</th>
                    <th scope="col" th:text="#{table.secaoFilial}">Seção/Filial</th>
                    <th scope="col" th:text="#{table.editar}">Editar</th>
                    <th scope="col" th:text="#{table.remover}">Remover</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="moto : ${motos}">
                    <th scope="row" th:text="${moto.idMoto}">A</th>
                    <td th:text="${moto.identificador}">B</td>
                    <td>
                        <span class="status-badge" th:text="${moto.status}" th:classappend="${'status-' + #strings.toLowerCase(moto.status)}">C</span>
                    </td>
                    <td th:text="${moto.condicoesManutencao}">D</td>
                    <td th:text="${moto.idTipoMoto != null ? moto.idTipoMoto.nmTipo : 'N/A'}">E</td>
                    <td th:text="${moto.idSecaoFilial != null and moto.idSecaoFilial.idTipoSecao != null ? moto.idSecaoFilial.idTipoSecao.nmSecao : 'N/A'}">F</td>
                    <td>
                        <a th:href="@{/view/moto/editar/{idMoto}(idMoto = ${moto.idMoto})}" th:text="#{action.editar}">Editar</a>
                    </td>
                    <td>
                        <a th:href="@{/view/moto/remover/{idMoto}(idMoto = ${moto.idMoto})}" th:text="#{action.remover}">Remover</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <p>
            <a href="/view/moto/nova" role="button" th:text="#{action.cadastrarNova}">Cadastrar uma Nova moto</a>
        </p>

        <div th:replace="~{fragmentos :: rodape}"></div>

        <style>
            /* Cards de Estatísticas */
            .stats-container {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 1.5rem;
                margin: 2rem 0;
            }

            .stat-card {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                padding: 1.5rem;
                border-radius: 12px;
                text-align: center;
                color: white;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                transition: transform 0.3s ease;
            }

            .stat-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            }

            .stat-card h3 {
                margin: 0 0 0.5rem 0;
                font-size: 1rem;
                opacity: 0.9;
            }

            .stat-number {
                font-size: 2.5rem;
                font-weight: bold;
                margin: 0;
            }

            .stat-desc {
                font-size: 0.9rem;
                margin: 0;
                opacity: 0.9;
            }

            /* Campo de Busca */
            .search-container {
                margin: 2rem 0;
            }

            .search-container input {
                width: 100%;
            }

            /* Badges de Status */
            .status-badge {
                display: inline-block;
                padding: 0.25rem 0.75rem;
                border-radius: 12px;
                font-weight: 500;
                font-size: 0.875rem;
            }

            .status-disponível, .status-disponivel {
                background-color: #d4edda;
                color: #155724;
            }

            .status-em.uso, .status-emuso {
                background-color: #fff3cd;
                color: #856404;
            }

            .status-manutenção, .status-manutencao {
                background-color: #f8d7da;
                color: #721c24;
            }
        </style>

        <script>
            // Função de filtro de tabela em tempo real
            function filterTable() {
                const input = document.getElementById('searchInput');
                const filter = input.value.toUpperCase();
                const table = document.getElementById('motosTable');
                const tr = table.getElementsByTagName('tr');

                for (let i = 1; i < tr.length; i++) {
                    let display = false;
                    const td = tr[i].getElementsByTagName('td');

                    for (let j = 0; j < td.length; j++) {
                        if (td[j]) {
                            const textValue = td[j].textContent || td[j].innerText;
                            if (textValue.toUpperCase().indexOf(filter) > -1) {
                                display = true;
                                break;
                            }
                        }
                    }

                    tr[i].style.display = display ? '' : 'none';
                }
            }
        </script>
    </main>
</body>

</html>
