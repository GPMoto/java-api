<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.jade.min.css"
        />
        <title th:text="#{login.title}">Login</title>
    </head>
    <body>
        <main>
            <nav>
                <ul>
                    <li><strong th:text="#{login.header}">Login</strong></li>
                </ul>
                <ul>
                    <li>
                        <div th:replace="~{fragmentos :: language-selector}" />
                    </li>
                </ul>
            </nav>

            <h2 th:text="#{login.header}">Login</h2>

            <div th:if="${param.falha != null and param.falha[0] == 'true'}">
                <strong th:text="#{login.failure}">Falha no login! Usuário ou senha incorretos.</strong>
            </div>

            <div th:if="${errorMessage}">
                <span th:text="${errorMessage}"></span>
            </div>

            <div th:if="${errors != null and !errors.empty}">
                <strong th:text="#{login.validation.errors}">Erros de validação:</strong>
                <ul>
                    <li
                        th:each="error : ${errors}"
                        th:text="${error.defaultMessage}"
                    ></li>
                </ul>
            </div>

            <div th:if="${param.logout}" th:text="#{login.logout.success}">Logout realizado com sucesso!</div>

            <div th:if="${param.erro == 'nao_autenticado'}" th:text="#{login.auth.required}">
                É necessário fazer login para acessar esta página.
            </div>

            <form th:action="@{/login}" method="post" id="loginForm">
                <label for="username">
                    <span th:text="#{login.username}">Usuário</span>
                    <input type="text" id="username" name="username" required />
                </label>

                <label for="password">
                    <span th:text="#{login.password}">Senha</span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    />
                </label>

                <button type="submit" th:text="#{login.submit}">Entrar</button>
            </form>

            <div id="errorMsg"></div>
        </main>
    </body>
</html>
