<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.jade.min.css"
        />
        <title>Login</title>
    </head>
    <body>
        <main>
            <h2>Login</h2>

            <div th:if="${param.falha != null and param.falha[0] == 'true'}">
                <strong>Falha no login!</strong> Usuário ou senha incorretos.
            </div>

            <div th:if="${errorMessage}">
                <span th:text="${errorMessage}"></span>
            </div>

            <div th:if="${errors != null and !errors.empty}">
                <strong>Erros de validação:</strong>
                <ul>
                    <li
                        th:each="error : ${errors}"
                        th:text="${error.defaultMessage}"
                    ></li>
                </ul>
            </div>

            <div th:if="${param.logout}">Logout realizado com sucesso!</div>

            <div th:if="${param.erro == 'nao_autenticado'}">
                É necessário fazer login para acessar esta página.
            </div>

            <form th:action="@{/login}" method="post" id="loginForm">
                <label for="username">
                    Usuário
                    <input type="text" id="username" name="username" required />
                </label>

                <label for="password">
                    Senha
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    />
                </label>

                <button type="submit">Entrar</button>
            </form>

            <div id="errorMsg"></div>
        </main>
    </body>
</html>
