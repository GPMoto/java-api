<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos :: cabecalho('Cadastrar Qrcode')}" />
    <body>
        <style th:replace="~{fragmentos :: footer-styles}"></style>
        <main>
            <div th:replace="~{fragmentos :: logo}" />
            <header
                style="
                    display: grid;
                    grid-template-columns: 1fr auto;
                    align-items: center;
                "
            >
                <h2>Cadastrar Novo Qrcode</h2>
                <a th:href="@{/login/index}" role="button">Voltar</a>
            </header>

            <form
                th:action="@{/view/qrcode/novo/{idFilial}(idFilial = ${idFilial})}"
                th:object="${qrcode}"
                method="post"
            >
                <input
                    type="hidden"
                    th:field="*{filial.idFilial}"
                    th:value="${idFilial}"
                />

                <label for="vlQrcode">
                    Valor Qrcode <mark>*</mark>
                    <input
                        type="text"
                        id="vlQrcode"
                        th:field="*{vlQrcode}"
                        maxlength="200"
                        placeholder="Digite o valor do Qrcode (ex: UWB-MOTO-001)"
                        required
                    />
                    <small>Máximo de 200 caracteres</small>
                </label>

                <label for="idMoto">
                    Moto Associada
                    <select id="idMoto" th:field="*{idMoto}">
                        <option value="">Nenhuma moto associada</option>
                        <option
                            th:each="moto : ${motos}"
                            th:value="${moto.idMoto}"
                            th:text="${moto.identificador + ' - ' + moto.status}"
                        ></option>
                    </select>
                    <small
                        >Selecione uma moto ou deixe em branco para associar
                        depois</small
                    >
                </label>

                <button type="submit">Cadastrar Qrcode</button>
            </form>
            <div th:replace="~{fragmentos :: rodape}"></div>

        </main>
    </body>
</html>
